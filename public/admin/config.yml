backend:
  name: github
  repo: markhoney/mark.honeychurch.org
  branch: master

site_url: https://mark.honeychurch.org
display_url: https://mark.honeychurch.org
logo:
  src: /media/images/icons/android-chrome-192x192.png
media_folder: public/media/uploads
public_folder: /media/uploads
publish_mode: editorial_workflow

asset_collections:
  - name: audio
    label: Audio
    icon: audio_file
    media_folder: /public/audio
    public_folder: /audio
  - name: video
    label: Video
    icon: video_file
    media_folder: /public/media/video
    public_folder: /media/video
  - name: documents
    label: Documents
    icon: description
    media_folder: /public/docs
    public_folder: /docs
  - name: programs
    label: Programs
    icon: package_2
    media_folder: /public/programs
    public_folder: /programs

collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    media_folder: /src/assets/content/blog
    public_folder: ../../assets/content/blog
    create: true
    extension: md
    format: frontmatter
    path: '{{slug}}'
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Slug, name: slug, widget: string}
      - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false}
      - {label: Draft, name: draft, widget: boolean, default: false, hint: 'Draft posts remain in the repository but are not built or listed.'}
      - label: Categories
        name: categories
        widget: select
        multiple: true
        options:
          - Alternatives
          - Code
          - COVID
          - Cryptography
          - Entertainment
          - HowTo
          - Life
          - Lists
          - Maths
          - Projects
          - Random
          - Software
        hint: The first category determines the URL section, for example Code or Random.
      - {label: Tags, name: tags, widget: list, label_singular: Tag, required: false}
      - {label: Body, name: body, widget: markdown}
  - name: interactive_posts
    label: Interactive Blog Posts
    label_singular: Interactive Blog Post
    folder: src/content/blog
    media_folder: /src/assets/content/blog
    public_folder: ../../assets/content/blog
    create: true
    extension: mdx
    format: frontmatter
    path: '{{slug}}'
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Slug, name: slug, widget: string}
      - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false}
      - {label: Draft, name: draft, widget: boolean, default: false, hint: 'Draft posts remain in the repository but are not built or listed.'}
      - label: Categories
        name: categories
        widget: select
        multiple: true
        options:
          - Alternatives
          - Code
          - COVID
          - Cryptography
          - Entertainment
          - HowTo
          - Life
          - Lists
          - Maths
          - Projects
          - Random
          - Software
        hint: The first category determines the URL section, for example Code or Random.
      - {label: Tags, name: tags, widget: list, label_singular: Tag, required: false}
      - label: Body
        name: body
        widget: markdown
        hint: 'Use an AppEmbed tag in source mode to place an interactive Vue demo, for example <AppEmbed app="code/coin/flip" />.'

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    media_folder: /src/assets/content/pages
    public_folder: ../../assets/content/pages
    nested:
      depth: 5
    create: true
    extension: md
    format: frontmatter
    path: '{{slug}}/index'
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string, required: false}
      - {label: URL, name: permalink, widget: string, hint: 'Absolute site path, for example /contact/ or /cv/full/'}
      - {label: Description, name: description, widget: string, required: false}
      - {label: Body, name: body, widget: markdown}

  - name: interactive_pages
    label: Interactive Pages
    label_singular: Interactive Page
    folder: src/content/pages
    media_folder: /src/assets/content/pages
    public_folder: ../../assets/content/pages
    nested:
      depth: 5
    create: false
    extension: mdx
    format: frontmatter
    path: '{{slug}}/index'
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string, required: false}
      - {label: URL, name: permalink, widget: string}
      - label: Body
        name: body
        widget: markdown
        hint: 'Interactive page components can be placed explicitly in source mode.'
